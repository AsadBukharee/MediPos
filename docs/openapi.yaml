components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 12
        name:
          type: string
          maxLength: 120
        type:
          $ref: '#/components/schemas/TypeEnum'
        is_system:
          type: boolean
          readOnly: true
          description: Used by automatic postings; cannot be removed.
        is_active:
          type: boolean
      required:
      - code
      - id
      - is_system
      - name
      - type
    AccountRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 12
        name:
          type: string
          minLength: 1
