# MediPos stack. Works with `docker compose up -d --build` and as a Coolify "Docker Compose" resource.
# Copy .env.example to .env and set real secrets first.

x-backend: &backend
  build: ./backend
  restart: unless-stopped
  environment: &backend-env
    DJANGO_DEBUG: "0"
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost}
    DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-1}
    DATABASE_URL: postgres://medipos:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/medipos
    REDIS_URL: redis://redis:6379/0
    TIME_ZONE: ${TIME_ZONE:-Asia/Karachi}
    FIREBASE_CREDENTIALS_FILE: ${FIREBASE_CREDENTIALS_FILE:-}
    SENTRY_DSN: ${SENTRY_DSN:-}
  volumes:
    - media:/app/media
    - ./secrets:/run/medipos-secrets:ro
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: medipos
      POSTGRES_USER: medipos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medipos -d medipos"]
      interval: 10s
      timeout: 5s
      retries: 6

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    <<: *backend
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "1"
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "--loglevel", "info", "--concurrency", "2"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3

  beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "--loglevel", "info", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_CURRENCY: ${NEXT_PUBLIC_CURRENCY:-PKR}
        NEXT_PUBLIC_BUSINESS_NAME: ${NEXT_PUBLIC_BUSINESS_NAME:-MediPos Pharmacy}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

  # Publishes the local backend on a stable public HTTPS hostname, so a frontend hosted
  # elsewhere (Vercel) and phones can reach it without a fixed IP or an open port.
  # Create a named tunnel in the Cloudflare dashboard, put its token in .env, then:
  #   docker compose --profile tunnel up -d cloudflared
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}"]
    depends_on:
      - backend

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "-c", "while true; do /scripts/backup.sh; sleep 86400; done"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  media:
